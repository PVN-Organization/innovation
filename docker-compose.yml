# Production / on-premise: external PostgreSQL (and later external MinIO on DB host).
# Temp MinIO stays in compose until MinIO on 10.1.8.101 is ready — use profile "temp-minio".
#
# Usage:
#   docker compose --profile temp-minio up -d
#   # After external MinIO is ready, drop the profile and set MINIO_ENDPOINT in .env

services:
  # ── MinIO (TEMPORARY — remove when MinIO runs on DB host) ─────────
  minio:
    profiles: ["temp-minio"]
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ── FastAPI Backend ───────────────────────────────────────────────
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      POSTGRES_ASYNC_URL: ${POSTGRES_ASYNC_URL}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-innovations}
      AZURE_AD_CLIENT_ID: ${AZURE_AD_CLIENT_ID:-}
      AZURE_AD_TENANT_ID: ${AZURE_AD_TENANT_ID:-}
      AZURE_AD_CLIENT_SECRET: ${AZURE_AD_CLIENT_SECRET:-}
      AZURE_AD_REDIRECT_URI: ${AZURE_AD_REDIRECT_URI:-}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-["https://portal.pvn.vn"]}
      FRONTEND_URL: ${FRONTEND_URL:-https://portal.pvn.vn/sang-kien}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      COOKIE_PATH: ${COOKIE_PATH:-/sang-kien}
      DEBUG: ${DEBUG:-false}
      BYPASS_AUTH_TEMP: ${BYPASS_AUTH_TEMP:-false}
    ports:
      - "${BACKEND_HOST_PORT:-10004}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ── Next.js Frontend (basePath /sang-kien) ────────────────────────
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-/sang-kien}
        NEXT_PUBLIC_BYPASS_AUTH_TEMP: ${NEXT_PUBLIC_BYPASS_AUTH_TEMP:-false}
    restart: unless-stopped
    cap_add:
      - NET_BIND_SERVICE
    ports:
      - "${FRONTEND_HOST_PORT:-10003}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  miniodata:

networks:
  default:
    name: innovation-net
