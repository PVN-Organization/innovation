# HAProxy snippet for https://portal.pvn.vn/sang-kien
#
# Merge into the existing portal.pvn.vn frontend config on 10.1.8.168.
# Adjust backend/server names to match your HAProxy style.
#
# Intent:
#   /sang-kien/api/*  → 127.0.0.1:10004  (strip /sang-kien so FastAPI sees /api/...)
#   /sang-kien/*      → 127.0.0.1:10003  (keep prefix — Next.js basePath=/sang-kien)

# --- ACLs (in frontend section for portal.pvn.vn) ---
acl is_sang_kien_api path_beg /sang-kien/api
acl is_sang_kien     path_beg /sang-kien

# --- Routing (order matters: API before general /sang-kien) ---
use_backend be_sang_kien_api if is_sang_kien_api
use_backend be_sang_kien_fe  if is_sang_kien

# --- Backends ---
backend be_sang_kien_api
    option forwardfor
    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    http-request set-header X-Forwarded-Host %[req.hdr(Host)]
    # Strip /sang-kien so backend receives /api/v1/...
    http-request replace-path ^/sang-kien(/.*)?$ \1
    server sang_kien_api 127.0.0.1:10004 check

backend be_sang_kien_fe
    option forwardfor
    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    http-request set-header X-Forwarded-Host %[req.hdr(Host)]
    # Do NOT strip — Next serves under /sang-kien
    server sang_kien_fe 127.0.0.1:10003 check
